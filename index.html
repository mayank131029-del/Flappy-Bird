<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <div class="menu-box" id="menu-box">

            <div class="menu">
                <h1 id="title">Flappy Bird</h1>
                <p>Press SPACE to start</p>
                <h2 id="yr-score"></h2>
            </div>
        </div>
        <div class="board">
            <div class="score" id="score">Score: 0</div>
            <div class="score" id="highscore">High Score: 0</div>
        </div>
        <div class="background" id="background">
            <div class="block-box">
                <div class="blocks" id="blocks">
                    

                </div>
            </div>
            <!-- <img id="backimg" src="assets/background.webp" alt=""> -->
        </div>
        <div class="bird-box" id="bird-box">
            <img src="assets/bird.png" alt="">
        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
